<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero To Hero - Ultimate Study Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 29, 47, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary-glow: #6366f1;
            --accent-glow: #a855f7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

        .bg-glow { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0,0,0,0) 70%); z-index: -1; filter: blur(80px); }
        .bg-glow-2 { position: fixed; bottom: -10%; right: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, rgba(0,0,0,0) 70%); z-index: -1; filter: blur(80px); }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 8%; background: rgba(11, 15, 25, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 10px; }

        .hero { text-align: center; padding: 3rem 1rem 1.5rem; }
        .hero h1 { font-size: 2.8rem; font-weight: 800; }
        .hero h1 span { background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: var(--text-sub); font-size: 1rem; margin-top: 5px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

        .exam-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.2rem; margin-bottom: 2rem; }
        .exam-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 1.2rem; border-radius: 16px; backdrop-filter: blur(10px); cursor: pointer; transition: all 0.3s ease; }
        .exam-card:hover { transform: translateY(-4px); border-color: var(--primary-glow); }
        .exam-card.active { border-color: var(--accent-glow); background: rgba(168, 85, 247, 0.18); }
        .exam-icon { font-size: 2rem; margin-bottom: 0.8rem; color: #38bdf8; }

        .portal-detail { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 2rem; backdrop-filter: blur(12px); }
        .portal-header h2 { font-size: 1.6rem; color: #fff; margin-bottom: 1.5rem; }

        .tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: var(--text-sub); padding: 10px 20px; font-size: 0.95rem; font-weight: 600; cursor: pointer; border-radius: 10px; transition: 0.3s; }
        .tab-btn.active { background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Syllabus Box Styling */
        .syllabus-box { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); padding: 1.5rem; border-radius: 12px; margin-bottom: 1rem; }
        .syllabus-box h3 { color: #38bdf8; font-size: 1.2rem; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
        .syllabus-list { list-style: none; padding-left: 5px; }
        .syllabus-list li { color: #cbd5e1; font-size: 0.95rem; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .syllabus-list li i { color: #a855f7; font-size: 0.8rem; }

        .content-box { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); padding: 1.2rem; border-radius: 12px; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .btn-download { background: #22c55e; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <nav>
        <div class="logo"><i class="fa-solid fa-graduation-cap"></i> ZERO TO HERO</div>
    </nav>

    <div class="hero">
        <h1>Select Your Target <span>Exam Portal</span></h1>
        <p>Detailed Syllabus, Subjects & PYQs in One Place</p>
    </div>

    <div class="container">
        <!-- Exam Cards -->
        <div class="exam-grid">
            <div class="exam-card active" onclick="switchExam('pet', this)">
                <i class="fa-solid fa-file-pen exam-icon"></i>
                <h3>UPSSSC PET</h3>
                <p>Preliminary Eligibility Test</p>
            </div>
            <div class="exam-card" onclick="switchExam('upsi', this)">
                <i class="fa-solid fa-shield-halved exam-icon"></i>
                <h3>UP SI</h3>
                <p>Sub Inspector Exam</p>
            </div>
            <div class="exam-card" onclick="switchExam('chsl', this)">
                <i class="fa-solid fa-laptop-code exam-icon"></i>
                <h3>SSC CHSL</h3>
                <p>10+2 Level Exam</p>
            </div>
            <div class="exam-card" onclick="switchExam('upsc', this)">
                <i class="fa-solid fa-building-columns exam-icon"></i>
                <h3>UPSC CSE</h3>
                <p>Civil Services Exam</p>
            </div>
        </div>

        <!-- Details Section -->
        <div class="portal-detail">
            <div class="portal-header">
                <h2 id="portal-title">UPSSSC PET Portal</h2>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('syllabus', this)"><i class="fa-solid fa-list-check"></i> Complete Syllabus</button>
                <button class="tab-btn" onclick="switchTab('subjects', this)"><i class="fa-solid fa-book-open"></i> Subjects & Notes</button>
                <button class="tab-btn" onclick="switchTab('pyqs', this)"><i class="fa-solid fa-clock-rotate-left"></i> PYQs</button>
            </div>

            <!-- TAB 1: SYLLABUS -->
            <div id="syllabus" class="tab-content active">
                <!-- Syllabus content will be loaded dynamically via JavaScript -->
            </div>

            <!-- TAB 2: SUBJECTS -->
            <div id="subjects" class="tab-content"></div>

            <!-- TAB 3: PYQS -->
            <div id="pyqs" class="tab-content"></div>
        </div>
    </div>

    <script>
        const portalData = {
            pet: {
                title: "UPSSSC PET Detailed Syllabus",
                syllabusHTML: `
                    <div class="syllabus-box">
                        <h3><i class="fa-solid fa-book"></i> भारतीय इतिहास (Indian History) - 5 अंक</h3>
                        <ul class="syllabus-list">
                            <li><i class="fa-solid fa-angle-right"></i> सिंधु घाटी सभ्यता (Indus Valley Civilization)</li>
                            <li><i class="fa-solid fa-angle-right"></i> वैदिक संस्कृति, बौद्ध धर्म (गौतम बुद्ध), जैन धर्म (महावीर)</li>
                            <li><i class="fa-solid fa-angle-right"></i> मौर्य वंश (सम्राट अशोक), गुप्त वंश, हर्षावर्धन, राजपूत काल</li>
                            <li><i class="fa-solid fa-angle-right"></i> सल्तनत काल, मुगल साम्राज्य, मराठा, ब्रिटिश राज का अभ्युदय</li>
                        </ul>
                    </div>
                    <div class="syllabus-box">
                        <h3><i class="fa-solid fa-scale-balanced"></i> भारतीय संविधान एवं लोक प्रशासन - 5 अंक</h3>
                        <ul class="syllabus-list">
                            <li><i class="fa-solid fa-angle-right"></i> भारतीय संविधान की मुख्य विशेषताएं & अनुसूचियां</li>
                            <li><i class="fa-solid fa-angle-right"></i> मौलिक अधिकार एवं कर्तव्य, राज्य के नीति निदेशक तत्व</li>
                            <li><i class="fa-solid fa-angle-right"></i> संसदीय प्रणाली, संघीय प्रणाली, केंद्र-राज्य संबंध</li>
                            <li><i class="fa-solid fa-angle-right"></i> त्रिस्तरीय पंचायती राज व्यवस्था</li>
                        </ul>
                    </div>
                    <div class="syllabus-box">
                        <h3><i class="fa-solid fa-brain"></i> तर्कशक्ति (Reasoning) - 5 अंक</h3>
                        <ul class="syllabus-list">
                            <li><i class="fa-solid fa-angle-right"></i> बृहत् एवं लघु, क्रम एवं रैंकिंग, संबंध (Blood Relations)</li>
                            <li><i class="fa-solid fa-angle-right"></i> समूह से भिन्न को अलग करना, कैलेंडर एवं घड़ी (Calendar & Clock)</li>
                            <li><i class="fa-solid fa-angle-right"></i> कारण और प्रभाव, कोडिंग-डिकोडिंग</li>
                        </ul>
                    </div>`,
                subjects: ["भारतीय इतिहास (History)", "भारतीय संविधान (Polity)", "तर्कशक्ति (Reasoning)", "ग्राफ एवं तालिका व्याख्या"],
                pyqs: "UPSSSC PET Previous Year Official Question Papers (PDF)"
            },
            upsi: {
                title: "UP Sub Inspector (SI) Detailed Syllabus",
                syllabusHTML: `
                    <div class="syllabus-box">
                        <h3><i class="fa-solid fa-gavel"></i> मूलविधि एवं संविधान (Mool Vidhi & Constitution)</h3>
                        <ul class="syllabus-list">
                            <li><i class="fa-solid fa-angle-right"></i> भारतीय न्याय संहिता / दंड प्रक्रिया संहिता, मानव अधिकार संरक्षण</li>
                            <li><i class="fa-solid fa-angle-right"></i> यातायात नियम, पर्यावरण संरक्षण, वन्यजीव संरक्षण अधिनियम</li>
                            <li><i class="fa-solid fa-angle-right"></i> संविधान का उद्देश्य, मौलिक अधिकार, नीतियाँ एवं संसदीय व्यवस्था</li>
                        </ul>
                    </div>
                    <div class="syllabus-box">
                        <h3><i class="fa-solid fa-calculator"></i> संख्यात्मक एवं मानसिक योग्यता (Maths)</h3>
                        <ul class="syllabus-list">
                            <li><i class="fa-solid fa-angle-right"></i> संख्या पद्धति (Number System), अभाज्य गुणनखंड (Prime Factors)</li>
                            <li><i class="fa-solid fa-angle-right"></i> प्रतिशतता, लाभ और हानि, साधारण व चक्रवृद्धि ब्याज</li>
                            <li><i class="fa-solid fa-angle-right"></i> समय और कार्य, गति और दूरी, अनुपात समानुपात</li>
                        </ul>
                    </div>`,
                subjects: ["मूलविधि एवं संविधान", "सामान्य हिंदी", "संख्यात्मक योग्यता (Maths)", "मानसिक अभिरुचि व रीजनिंग"],
                pyqs: "UP SI All Shift Solved Papers (Answer Key Included)"
            },
            chsl: {
                title: "SSC CHSL (10+2) Detailed Syllabus",
                syllabusHTML: `
                    <div class="syllabus-box">
                        <h3><i class="fa-solid fa-square-root-variable"></i> Quantitative Aptitude</h3>
                        <ul class="syllabus-list">
                            <li><i class="fa-solid fa-angle-right"></i> Number System, Simplification, Prime Factorization</li>
                            <li><i class="fa-solid fa-angle-right"></i> Percentage, Profit & Loss, Simple & Compound Interest</li>
                            <li><i class="fa-solid fa-angle-right"></i> Geometry, Mensuration, Trigonometry, Algebra</li>
                        </ul>
                    </div>
                    <div class="syllabus-box">
                        <h3><i class="fa-solid fa-puzzle-piece"></i> General Intelligence & Reasoning</h3>
                        <ul class="syllabus-list">
                            <li><i class="fa-solid fa-angle-right"></i> Calendar, Clocks, Blood Relations, Directions & Distances</li>
                            <li><i class="fa-solid fa-angle-right"></i> Coding-Decoding, Venn Diagrams, Matrix & Syllogism</li>
                        </ul>
                    </div>`,
                subjects: ["Quantitative Aptitude", "General Intelligence & Reasoning", "English Language", "General Awareness"],
                pyqs: "SSC CHSL Tier-1 & Tier-2 Previous Papers PDF"
            },
            upsc: {
                title: "UPSC Civil Services Detailed Syllabus",
                syllabusHTML: `
                    <div class="syllabus-box">
                        <h3><i class="fa-solid fa-landmark"></i> Paper I: General Studies (GS)</h3>
                        <ul class="syllabus-list">
                            <li><i class="fa-solid fa-angle-right"></i> History of India & Indian National Movement</li>
                            <li><i class="fa-solid fa-angle-right"></i> Indian & World Geography, Polity & Governance</li>
                            <li><i class="fa-solid fa-angle-right"></i> Economic & Social Development, Environmental Ecology</li>
                        </ul>
                    </div>`,
                subjects: ["GS Paper 1 (Polity, History, Geo)", "CSAT Paper 2 (Reasoning & Maths)", "Mains Optional Subjects"],
                pyqs: "UPSC Mains & Prelims Last 10 Years Papers"
            }
        };

        function switchExam(examKey, cardElement) {
            document.querySelectorAll('.exam-card').forEach(card => card.classList.remove('active'));
            cardElement.classList.add('active');
            
            const data = portalData[examKey];
            document.getElementById('portal-title').innerText = data.title;

            // Load Syllabus
            document.getElementById('syllabus').innerHTML = data.syllabusHTML;

            // Load Subjects
            let subjectsHTML = '';
            data.subjects.forEach(sub => {
                subjectsHTML += `
                    <div class="content-box">
                        <div>
                            <h4>${sub}</h4>
                            <p style="color: var(--text-sub); font-size: 0.85rem;">Chapter-wise Notes & One-Liners</p>
                        </div>
                        <a href="#" class="btn-download"><i class="fa-solid fa-folder-open"></i> Study Now</a>
                    </div>`;
            });
            document.getElementById('subjects').innerHTML = subjectsHTML;

            // Load PYQs
            document.getElementById('pyqs').innerHTML = `
                <div class="content-box">
                    <div>
                        <h4>${data.pyqs}</h4>
                        <p style="color: var(--text-sub); font-size: 0.85rem;">Solved Papers with Detailed Solutions</p>
                    </div>
                    <a href="#" class="btn-download"><i class="fa-solid fa-file-pdf"></i> Download PDF</a>
                </div>`;
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            btnElement.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // Initialize First Exam View
        switchExam('pet', document.querySelector('.exam-card.active'));
    </script>
</body>
</html>
