<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071426">
<title>PROJECT IQBAL | Human × AI Exam Academy</title>
<style>
:root{
  --bg:#071426;--panel:#101f35;--panel2:#162943;--line:#263c59;
  --text:#f1f5ff;--muted:#a9bad1;--gold:#f6c453;--blue:#60a5fa;
  --green:#48d597;--red:#ff7272;--radius:18px
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:#071426f5;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.top{max-width:1200px;margin:auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;font-size:17px;letter-spacing:.4px}
.brand span{color:var(--gold)}
.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:1.2px}
.menu{display:flex;gap:7px;overflow-x:auto;padding:0 12px 12px;max-width:1200px;margin:auto;scrollbar-width:thin}
.navbtn,.btn{border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);padding:10px 13px;white-space:nowrap}
.navbtn.active,.btn.primary{background:var(--gold);border-color:var(--gold);color:#172033;font-weight:800}
.btn.secondary{background:var(--panel2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1200px;margin:auto;padding:22px 15px 70px}
.hero{padding:27px 22px;border:1px solid #344967;border-radius:24px;background:radial-gradient(circle at 85% 10%,#234a72 0,transparent 38%),linear-gradient(135deg,#142b47,#0c192d);margin-bottom:18px}
.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:1.6px}
h1{font-size:clamp(27px,5vw,43px);line-height:1.14;margin:12px 0}
h2{font-size:23px;margin:0 0 14px}
h3{margin:0 0 9px}
p{line-height:1.65}
.muted{color:var(--muted)}
.gold{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px;min-width:0}
.card p{margin:7px 0;color:var(--muted)}
.stat{font-size:27px;font-weight:900;color:var(--gold)}
.section{margin-top:25px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}
input,select,textarea{background:#08172a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;max-width:100%}
.search{width:100%;margin-bottom:13px}
select{max-width:100%}
.topic-list{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{padding:8px 11px;border:1px solid var(--line);border-radius:30px;background:var(--panel2);color:var(--text)}
.chip.active{background:var(--gold);color:#172033;border-color:var(--gold);font-weight:800}
.lesson{border-left:3px solid var(--gold);padding:10px 13px;background:#0b1a2e;border-radius:0 12px 12px 0;margin:12px 0}
.mnemonic{border:1px dashed #617c9f;padding:12px;border-radius:12px;margin-top:10px}
.option{display:block;width:100%;text-align:left;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin:9px 0}
.option:hover{border-color:var(--gold)}
.option.correct{border-color:var(--green);background:#123a31}
.option.wrong{border-color:var(--red);background:#3b202b}
.feedback{padding:13px;border-radius:12px;margin-top:12px;background:#0b1a2e;border:1px solid var(--line);line-height:1.6}
.progress{height:8px;background:#24364d;border-radius:20px;overflow:hidden;margin:12px 0}
.progress div{height:100%;background:var(--green);width:0;transition:width .2s}
.badge{display:inline-block;border:1px solid var(--line);padding:5px 8px;border-radius:8px;color:var(--muted);font-size:12px;margin:3px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.small{font-size:12px}
footer{border-top:1px solid var(--line);padding:24px;text-align:center;color:var(--muted);font-size:12px}
.hidden{display:none!important}
.notice{padding:13px;background:#302a19;border:1px solid #675329;border-radius:12px;color:#ffe4a1;line-height:1.6}
.success{color:var(--green)}.danger{color:var(--red)}
a{color:var(--blue)}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.hero{padding:21px 16px}.card{padding:14px}.top{padding:12px}}
@media(max-width:430px){.grid{grid-template-columns:1fr}.brand{font-size:15px}.navbtn{padding:9px 11px;font-size:13px}main{padding-top:15px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">PROJECT <span>IQBAL</span><small>HUMAN × AI EXAM ACADEMY</small></div>
    <span class="badge">LEARN • PRACTICE • IMPROVE</span>
  </div>
  <nav class="menu" id="navigation"></nav>
</header>

<main id="app"></main>

<footer>
  PROJECT IQBAL · Learn from basics, practise topic-wise, revise your mistakes.<br>
  अभ्यास प्रश्नों को आधिकारिक PYQ तभी मानें जब उनका मूल स्रोत सत्यापित हो।
</footer>
